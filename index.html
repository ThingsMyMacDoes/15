<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15-Minute City Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #17202a;
      --muted: #68717c;
      --line: #e5e7eb;
      --paper: #ffffff;
      --bg: #f4f5f3;
      --walk: #2563eb;
      --bike: #059669;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
    }

    .header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: .85rem 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
      z-index: 1200;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
    }

    .search-container {
      flex: 1;
      position: relative;
    }

    .search-input-wrapper { position: relative; }

    #addressInput {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      color: var(--ink);
    }

    #addressInput:focus {
      outline: none;
      border-color: #1a1a1a;
      box-shadow: 0 0 0 2px rgba(0,0,0,.05);
    }

    .suggestions {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 2000;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }

    .suggestions.show { display: block; }

    .suggestion-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .suggestion-item:hover { background: #fafafa; }

    .workspace {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 410px;
      background: var(--bg);
      position: relative;
    }

    #map {
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100%;
      background: #e8ebe7;
    }

    .info-panel {
      min-width: 0;
      min-height: 0;
      background: white;
      border-left: 1px solid var(--line);
      padding: 1rem;
      overflow-y: auto;
      display: none;
    }

    .info-panel.show { display: block; }

    .panel-kicker {
      font-size: 11px;
      letter-spacing: .12em;
      font-weight: 700;
      color: #737b84;
      margin-bottom: 4px;
    }

    .panel-title {
      font-size: 21px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .selected-location {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .score-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: #fbfcfb;
    }

    .score-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
    }

    .score {
      font-size: 38px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -.04em;
    }

    .score-label {
      color: var(--muted);
      font-size: 12px;
      padding-bottom: 4px;
    }

    .score-bar {
      height: 7px;
      border-radius: 99px;
      background: #e8ece9;
      overflow: hidden;
      margin-top: 11px;
    }

    .score-fill {
      height: 100%;
      border-radius: inherit;
      transition: width .35s ease;
    }

    .transport-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 12px;
    }

    .mode-btn, .category-toggle {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 9px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .mode-btn.active {
      background: #17202a;
      color: white;
      border-color: #17202a;
    }

    .category-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }

    .category-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      text-align: left;
      font-weight: 500;
    }

    .category-toggle.off { opacity: .45; }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 14px 0 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .section-heading span {
      color: #8a929a;
      font-size: 11px;
      font-weight: 500;
    }

    .status-grid {
      display: grid;
      gap: 6px;
    }

    .status-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 9px;
      border: 1px solid #edf0ee;
      border-radius: 8px;
      font-size: 12px;
    }

    .status-name { font-weight: 600; }
    .status-meta { color: #858d95; font-size: 11px; }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 99px;
      background: #f1f3f2;
    }

    .status-badge.available { background: #e8f6ee; color: #147a45; }
    .status-badge.limited { background: #fff5df; color: #9a6500; }
    .status-badge.missing { background: #fbeaea; color: #a33a3a; }

    .gap-box {
      border: 1px solid #f0dede;
      background: #fffafa;
      border-radius: 9px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .category-section {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .category-title {
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      color: #666;
      margin-bottom: .45rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .category-icon {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .business-item {
      padding: 8px 0;
      font-size: 13px;
      color: #1a1a1a;
      border-bottom: 1px solid #f5f5f5;
    }

    .business-name { font-weight: 600; line-height: 1.35; }
    .business-distance { font-size: 11px; color: #999; margin-top: 2px; }

    .loading {
      text-align: center;
      color: #666;
      padding: 1rem;
      font-size: 14px;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 9px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      font-size: 11px;
      z-index: 400;
    }

    .legend-title { font-weight: 700; margin-bottom: 7px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 5px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .mode-key {
      width: 18px;
      height: 0;
      border-top: 3px solid;
      display: inline-block;
    }

    .hint {
      font-size: 11px;
      color: #858d95;
      line-height: 1.45;
      margin-top: 10px;
    }

    .empty-state {
      padding: 18px 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 900px) {
      .brand { display: none; }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(320px, 52vh) minmax(300px, 48vh);
      }
      .info-panel {
        border-left: none;
        border-top: 1px solid var(--line);
      }
      .legend { bottom: 12px; left: 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div class="brand">15-Minute City</div>
      <div class="search-container">
        <div class="search-input-wrapper">
          <input type="text" id="addressInput"
            placeholder="Enter an address (e.g. Graffiti Street 1, Ghent)"
            autocomplete="off" />
          <div class="suggestions" id="suggestions"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="workspace">
    <div id="map"></div>

    <div class="info-panel" id="infoPanel">
      <div id="analysisPanel">
        <div class="empty-state">
          Search for an address or click a point on the map to analyse its 15-minute neighbourhood.
        </div>
      </div>
    </div>
  </div>

  <div class="legend" id="legend">
    <div class="legend-title">15-minute catchments</div>
    <div class="legend-item"><span class="mode-key" style="border-color:#2563eb;"></span><span>Walking</span></div>
    <div class="legend-item"><span class="mode-key" style="border-color:#059669;"></span><span>Cycling</span></div>
    <div id="legendCategories"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let circle;
    let markers = [];
    let   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let currentLocation = null;
    let userMarker = null;
    let walkCatchment = null;
    let bikeCatchment = null;
    let markers = [];
    let lastBusinesses = [];
    let activeMode = 'walk';
    let activeCategories = new Set();

    const WALK_MINUTES = 15;
    const BIKE_MINUTES = 15;

    // Fallback distances are used only when the public isochrone service is unavailable.
    // They are intentionally conservative approximations rather than "exact" network travel.
    const FALLBACK_WALK_RADIUS = 1100;
    const FALLBACK_BIKE_RADIUS = 3500;

    const amenityCategories = {
      'Housing': {
        color: '#7c3aed',
        tags: [
          ['building', ['apartments','residential','house','detached','semidetached_house','terrace']],
          ['amenity', ['shelter']]
        ],
        scoreWeight: 0
      },
      'Food & everyday shopping': {
        color: '#ef4444',
        tags: [
          ['shop', ['supermarket','grocery','convenience','bakery','butcher','greengrocer','food','general','market','deli','pastry']],
          ['amenity', ['marketplace','cafe','restaurant']]
        ],
        scoreWeight: 1.2
      },
      'Healthcare & care': {
        color: '#2563eb',
        tags: [
          ['amenity', ['pharmacy','doctors','clinic','hospital','dentist','social_facility','nursing_home','childcare']],
          ['healthcare', ['doctor','dentist','clinic','physiotherapist','psychotherapist','hospital','pharmacy']]
        ],
        scoreWeight: 1.2
      },
      'Education': {
        color: '#8b5cf6',
        tags: [
          ['amenity', ['school','kindergarten','college','university','library','childcare']],
          ['education', ['school','kindergarten','college','university']]
        ],
        scoreWeight: 1.2
      },
      'Parks, nature & recreation': {
        color: '#10b981',
        tags: [
          ['leisure', ['park','playground','garden','pitch','sports_pitch','track','nature_reserve']],
          ['landuse', ['recreation_ground','grass','forest']],
          ['natural', ['wood','grassland','scrub']]
        ],
        scoreWeight: 1.0
      },
      'Sports & leisure': {
        color: '#0f766e',
        tags: [
          ['leisure', ['sports_centre','fitness_centre','swimming_pool','stadium','pitch','track','golf_course']],
          ['sport', ['tennis','basketball','soccer','football','cycling']]
        ],
        scoreWeight: 0.8
      },
      'Culture & community': {
        color: '#db2777',
        tags: [
          ['amenity', ['library','community_centre','arts_centre','theatre','social_centre','youth_centre']],
          ['tourism', ['museum','gallery']],
          ['leisure', ['community_centre']]
        ],
        scoreWeight: 0.8
      },
      'Work & economic activity': {
        color: '#475569',
        tags: [
          ['office', ['yes','coworking']],
          ['building', ['office','commercial','retail']],
          ['shop', ['yes']]
        ],
        scoreWeight: 0.7
      },
      'Everyday services': {
        color: '#f59e0b',
        tags: [
          ['amenity', ['post_office','bank','atm','police','fire_station','laundry','bureau_de_change']],
          ['shop', ['hairdresser','laundry','repair','electronics','computer','clothes','shoes','books']]
        ],
        scoreWeight: 0.8
      },
      'Mobility': {
        color: '#0891b2',
        tags: [
          ['highway', ['bus_stop','cycleway','footway','pedestrian','path']],
          ['railway', ['station','tram_stop','halt']],
          ['amenity', ['bicycle_parking','bus_station','taxi']],
          ['public_transport', ['platform','stop_position','station']]
        ],
        scoreWeight: 0.7
      },
      'Public realm & civic infrastructure': {
        color: '#64748b',
        tags: [
          ['amenity', ['toilets','drinking_water','bench','recycling','waste_basket','townhall']],
          ['highway', ['pedestrian','living_street','traffic_calming']]
        ],
        scoreWeight: 0.5
      }
    };

    const scoredCategories = Object.keys(amenityCategories)
      .filter(c => amenityCategories[c].scoreWeight > 0);

    scoredCategories.forEach(c => activeCategories.add(c));

    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([51.0543, 3.7174], 12);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      map.on('click', e => selectAddress(e.latlng.lat, e.latlng.lng, 'Selected map location'));
      buildLegend();
    }

    function haversine(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng/2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getCategory(b) {
      const tags = b.tags || {};
      for (const [category, config] of Object.entries(amenityCategories)) {
        for (const [key, values] of config.tags) {
          if (tags[key] && values.includes(tags[key])) return category;
        }
      }
      return null;
    }

    function getCategoryColor(category) {
      return amenityCategories[category]?.color || '#6b7280';
    }

    function elementPoint(el) {
      return {
        lat: el.center?.lat ?? el.lat,
        lng: el.center?.lon ?? el.lon
      };
    }

    async function getAddressSuggestions(query) {
      if (query.length < 3) return [];
      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=6&countrycodes=be`
        );
        return response.ok ? await response.json() : [];
      } catch (e) {
        console.error('Geocoding error:', e);
        return [];
      }
    }

    function overpassRegex(values) {
      return values.join('|').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function buildOverpassQuery(lat, lng, radius) {
      const clauses = [];
      for (const config of Object.values(amenityCategories)) {
        for (const [key, values] of config.tags) {
          const pattern = overpassRegex(values);
          clauses.push(`nwr(around:${radius},${lat},${lng})["${key}"~"^(${pattern})$"]`);
        }
      }
      return `
        [out:json][timeout:25];
        (
          ${clauses.join(';\n')}
        );
        out center tags;
      `;
    }

    async function searchBusinesses(lat, lng) {
      const query = buildOverpassQuery(lat, lng, Math.max(FALLBACK_BIKE_RADIUS, 3800));
      try {
        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `data=${encodeURIComponent(query)}`
        });
        if (!response.ok) throw new Error(`Overpass API error: ${response.status}`);
        const data = await response.json();

        return (data.elements || []).map(el => {
          const p = elementPoint(el);
          const category = getCategory(el);
          return {
            ...el,
            ...p,
            category,
            distance: haversine(lat, lng, p.lat, p.lng)
          };
        }).filter(x => x.lat && x.lng && x.category);
      } catch (e) {
        console.error('Overpass error:', e);
        return [];
      }
    }

    // Uses Valhalla's public OSM-based isochrone service when available.
    // If it cannot be reached, the UI falls back to a clearly labelled radius approximation.
    async function getIsochrone(lat, lng, costing, minutes) {
      const url = 'https://valhalla1.openstreetmap.de/isochrone';
      const body = {
        locations: [{ lat, lon: lng }],
        costing,
        contours: [{ time: minutes }],
        polygons: true,
        denoise: 0.1,
        generalize: 50
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!response.ok) throw new Error(`Isochrone API ${response.status}`);
        const data = await response.json();
        const feature = data.features?.[0];
        if (!feature?.geometry) throw new Error('No isochrone geometry returned');
        return feature.geometry;
      } catch (e) {
        console.warn(`Network ${costing} isochrone unavailable; using fallback radius.`, e);
        return null;
      }
    }

    function geoJsonToLayer(geometry, style) {
      if (!geometry) return null;
      return L.geoJSON({
        type: 'Feature',
        properties: {},
        geometry
      }, { style }).addTo(map);
    }

    async function drawCatchments(lat, lng) {
      if (walkCatchment) map.removeLayer(walkCatchment);
      if (bikeCatchment) map.removeLayer(bikeCatchment);

      walkCatchment = geoJsonToLayer(
        await getIsochrone(lat, lng, 'pedestrian', WALK_MINUTES),
        { color: '#2563eb', fillColor: '#2563eb', fillOpacity: .08, weight: 2 }
      );

      bikeCatchment = geoJsonToLayer(
        await getIsochrone(lat, lng, 'bicycle', BIKE_MINUTES),
        { color: '#059669', fillColor: '#059669', fillOpacity: .07, weight: 2, dashArray: '7,5' }
      );

      if (!walkCatchment) {
        walkCatchment = L.circle([lat, lng], {
          radius: FALLBACK_WALK_RADIUS,
          color: '#2563eb', fillColor: '#2563eb',
          fillOpacity: .05, weight: 2, dashArray: '5,5'
        }).addTo(map);
      }

      if (!bikeCatchment) {
        bikeCatchment = L.circle([lat, lng], {
          radius: FALLBACK_BIKE_RADIUS,
          color: '#059669', fillColor: '#059669',
          fillOpacity: .025, weight: 2, dashArray: '7,5'
        }).addTo(map);
      }
    }

    function clearAmenityMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function addAmenityMarkers() {
      clearAmenityMarkers();
      const maxDistance = FALLBACK_BIKE_RADIUS;

      lastBusinesses
        .filter(b => activeCategories.has(b.category) && b.distance <= maxDistance)
        .sort((a,b) => a.distance - b.distance)
        .forEach(b => {
          const name = b.tags?.name || 'Unnamed place';
          const color = getCategoryColor(b.category);

          const marker = L.circleMarker([b.lat, b.lng], {
            radius: 5,
            fillColor: color,
            color: '#fff',
            weight: 1.5,
            opacity: 1,
            fillOpacity: .88
          }).bindPopup(`
            <strong>${esc(name)}</strong><br>
            <span style="font-size:12px;color:#666">${esc(b.category)}</span><br>
            <span style="font-size:12px;color:#888">${Math.round(b.distance)} m straight-line distance</span>
            ${b.tags?.opening_hours ? `<br><span style="font-size:12px">🕐 ${esc(b.tags.opening_hours)}</span>` : ''}
            ${b.tags?.website ? `<br><a href="${esc(b.tags.website)}" target="_blank" rel="noopener">Website</a>` : ''}
          `).addTo(map);

          markers.push(marker);
        });
    }

    function categoryStats(category) {
      const items = lastBusinesses.filter(b =>
        b.category === category &&
        b.distance <= (activeMode === 'walk' ? FALLBACK_WALK_RADIUS : FALLBACK_BIKE_RADIUS)
      );

      const named = items.filter(x => x.tags?.name);
      const count = items.length;
      const variety = new Set(named.map(x => x.tags?.amenity || x.tags?.shop || x.tags?.leisure || x.tags?.healthcare || x.tags?.tourism)).size;

      return { count, variety, nearest: items.length ? Math.min(...items.map(x => x.distance)) : null };
    }

    function categoryStatus(category) {
      const s = categoryStats(category);
      if (!s.count) return { label: 'Missing', className: 'missing', count: 0 };
      if (s.count >= 3 || s.variety >= 2) return { label: 'Available', className: 'available', count: s.count };
      return { label: 'Limited', className: 'limited', count: s.count };
    }

    function computeScore() {
      let totalWeight = 0;
      let earned = 0;

      scoredCategories.forEach(category => {
        const weight = amenityCategories[category].scoreWeight;
        const s = categoryStats(category);
        let value = s.count === 0 ? 0 : (s.count >= 3 || s.variety >= 2 ? 1 : .55);
        earned += value * weight;
        totalWeight += weight;
      });

      // Small mobility bonuses based on mapped network-related OSM features.
      const mobility = categoryStats('Mobility');
      if (mobility.count > 0) {
        earned += Math.min(0.8, mobility.count / 10) * .7;
        totalWeight += .7;
      }

      return totalWeight ? Math.round((earned / totalWeight) * 100) : 0;
    }

    function scoreTone(score) {
      if (score >= 80) return 'Excellent';
      if (score >= 65) return 'Good';
      if (score >= 45) return 'Moderate';
      return 'Needs improvement';
    }

    function buildAnalysisPanel() {
      const score = computeScore();
      const scoreText = scoreTone(score);

      const dailyCategories = [
        'Food & everyday shopping', 'Healthcare & care', 'Education',
        'Parks, nature & recreation', 'Culture & community',
        'Everyday services', 'Work & economic activity'
      ];

      const mobilityCategories = ['Mobility'];

      const renderStatus = category => {
        const st = categoryStatus(category);
        const stats = categoryStats(category);
        return `
          <div class="status-item">
            <span class="dot" style="background:${getCategoryColor(category)}"></span>
            <div>
              <div class="status-name">${esc(category)}</div>
              <div class="status-meta">${stats.count} mapped location${stats.count === 1 ? '' : 's'}${stats.nearest != null ? ` · nearest ${Math.round(stats.nearest)} m` : ''}</div>
            </div>
            <span class="status-badge ${st.className}">${st.label}</span>
          </div>
        `;
      };

      const gaps = dailyCategories.filter(c => categoryStatus(c).label !== 'Available');

      document.getElementById('analysisPanel').innerHTML = `
        <div class="panel-kicker">15-MINUTE CITY ANALYSIS</div>
        <div class="panel-title">Neighbourhood completeness</div>
        <div class="selected-location">${esc(currentLocation?.name || 'Selected location')}</div>

        <div class="score-card">
          <div class="score-row">
            <div class="score">${score}<span style="font-size:18px">/100</span></div>
            <div class="score-label">${scoreText}</div>
          </div>
          <div class="score-bar"><div class="score-fill" style="width:${score}%;background:${score >= 65 ? '#16834b' : score >= 45 ? '#b7791f' : '#b54747'}"></div></div>
        </div>

        <div class="transport-toggle">
          <button class="mode-btn ${activeMode === 'walk' ? 'active' : ''}" data-mode="walk">🚶 15-min walk</button>
          <button class="mode-btn ${activeMode === 'bike' ? 'active' : ''}" data-mode="bike">🚲 15-min cycle</button>
        </div>

        <div class="section-heading">Map layers <span>toggle categories</span></div>
        <div class="category-controls">
          ${Object.keys(amenityCategories).map(c => `
            <button class="category-toggle ${activeCategories.has(c) ? '' : 'off'}" data-category="${esc(c)}">
              <span class="dot" style="background:${getCategoryColor(c)}"></span>${esc(c)}
            </button>
          `).join('')}
        </div>

        <div class="section-heading">Daily needs <span>${activeMode === 'walk' ? '15-min walk' : '15-min cycle'}</span></div>
        <div class="status-grid">${dailyCategories.map(renderStatus).join('')}</div>

        <div class="section-heading">Mobility <span>local network</span></div>
        <div class="status-grid">${mobilityCategories.map(renderStatus).join('')}</div>

        <div class="section-heading">Gaps & opportunities</div>
        <div class="gap-box">
          ${gaps.length
            ? gaps.map(c => `• ${esc(c)} is ${categoryStatus(c).label.toLowerCase()} in the selected catchment.`).join('<br>')
            : 'No major daily-need gaps detected in the mapped OpenStreetMap data.'}
        </div>

        <div class="hint">
          The score measures <strong>coverage across different daily needs</strong>, not the raw number of amenities.
          Travel-time polygons use an OSM-based routing service when available; otherwise the map falls back to approximate radii.
          OpenStreetMap coverage varies by place, so this is an exploratory planning indicator rather than a definitive accessibility audit.
        </div>

        <div class="section-heading">Nearby places <span>${lastBusinesses.length} mapped</span></div>
        <div id="businessesList">${renderBusinessList()}</div>
      `;

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeMode = btn.dataset.mode;
          addAmenityMarkers();
          buildAnalysisPanel();
        });
      });

      document.querySelectorAll('.category-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const category = btn.dataset.category;
          if (activeCategories.has(category)) activeCategories.delete(category);
          else activeCategories.add(category);
          addAmenityMarkers();
          buildAnalysisPanel();
        });
      });
    }

    function renderBusinessList() {
      if (!lastBusinesses.length) {
        return `<div class="empty-state">No matching amenities were returned from OpenStreetMap. Try another location.</div>`;
      }

      const groups = {};
      lastBusinesses
        .filter(b => activeCategories.has(b.category))
        .sort((a,b) => a.distance - b.distance)
        .forEach(b => (groups[b.category] ||= []).push(b));

      return Object.entries(groups).map(([category, items]) => `
        <div class="category-section">
          <div class="category-title">
            <span class="category-icon" style="background:${getCategoryColor(category)}"></span>
            ${esc(category)} <span style="font-size:10px;color:#999;font-weight:500">(${items.length})</span>
          </div>
          ${items.slice(0, 8).map(b => `
            <div class="business-item">
              <div class="business-name">${esc(b.tags?.name || 'Unnamed place')}</div>
              <div class="business-distance">${Math.round(b.distance)} m away</div>
            </div>
          `).join('')}
          ${items.length > 8 ? `<div class="business-distance">+ ${items.length - 8} more on the map</div>` : ''}
        </div>
      `).join('') || `<div class="empty-state">No enabled categories have mapped amenities in this area.</div>`;
    }

    function placeUserMarker(lat, lng) {
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([lat, lng], {
        radius: 8,
        fillColor: '#111827',
        color: '#fff',
        weight: 3,
        opacity: 1,
        fillOpacity: .95
      }).bindPopup('<strong>Selected location</strong>').addTo(map);
    }

    async function selectAddress(lat, lng, name) {
      currentLocation = { lat, lng, name };
      document.getElementById('addressInput').value = name;
      document.getElementById('suggestions').classList.remove('show');
      document.getElementById('infoPanel').classList.add('show');
      document.getElementById('analysisPanel').innerHTML =
        '<div class="loading">Building walking and cycling catchments…<br><span style="font-size:11px">Finding OpenStreetMap amenities and network accessibility.</span></div>';

      placeUserMarker(lat, lng);
      map.setView([lat, lng], 14);

      const [businesses] = await Promise.all([
        searchBusinesses(lat, lng),
        drawCatchments(lat, lng)
      ]);

      lastBusinesses = businesses;
      addAmenityMarkers();
      buildAnalysisPanel();

      if (walkCatchment || bikeCatchment) {
        const bounds = [];
        if (walkCatchment) bounds.push(walkCatchment.getBounds());
        if (bikeCatchment) bounds.push(bikeCatchment.getBounds());
        if (bounds.length) {
          const combined = bounds.reduce((acc, b) => acc ? acc.extend(b) : b, null);
          if (combined?.isValid()) map.fitBounds(combined.pad(.08));
        }
      }
    }

    function buildLegend() {
      const el = document.getElementById('legendCategories');
      el.innerHTML = Object.entries(amenityCategories).map(([name, cfg]) => `
        <div class="legend-item">
          <span class="legend-color" style="background:${cfg.color}"></span>
          <span>${esc(name)}</span>
        </div>
      `).join('');
    }

    document.getElementById('addressInput').addEventListener('input', async e => {
      const query = e.target.value.trim();
      const suggestionsEl = document.getElementById('suggestions');

      if (query.length < 3) {
        suggestionsEl.classList.remove('show');
        return;
      }

      const suggestions = await getAddressSuggestions(query);
      if (!suggestions.length) {
        suggestionsEl.classList.remove('show');
        return;
      }

      suggestionsEl.innerHTML = suggestions.map(s => `
        <div class="suggestion-item"
          data-lat="${esc(s.lat)}"
          data-lng="${esc(s.lon)}"
          data-name="${esc(s.display_name)}">
          ${esc(s.display_name)}
        </div>
      `).join('');

      suggestionsEl.classList.add('show');

      document.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          selectAddress(
            parseFloat(item.dataset.lat),
            parseFloat(item.dataset.lng),
            item.dataset.name
          );
        });
      });
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-container')) {
        document.getElementById('suggestions').classList.remove('show');
      }
    });

    initMap();
  </script>
</body>
</html>
